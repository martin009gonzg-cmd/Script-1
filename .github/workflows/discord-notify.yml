name: Notify Discord on Push

on:
  push:
    branches: [main]

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Send Discord Notification
        run: |
          curl -H "Content-Type: application/json" \
          -X POST \
          -d '{
            "username": "BLADEX HUD",
            "avatar_url": "https://i.imgur.com/TuIcono.png",
            "embeds": [{
              "title": "⚔️ UpgradeLuckyBlock",
              "description": "**NUEVA FUNCIÓN**\n\n[+] Añadido Auto Collect Cash\n[+] Añadido Auto Upgrade Brainrots\n[+] Añadido Auto Open\n[+] Añadido Auto Buy Lucky Blocks",
              "color": 5763719,
              "footer": {
                "text": "BLADEX HUD • GitHub Actions"
              }
            }]
          }' \
          ${{ secrets.DISCORD_WEBHOOK_URL }}
